name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every job only checks out and executes repository contents. Keep the
# short-lived Actions token read-only even if the organization default is
# broader.
permissions:
  contents: read

# Only the newest commit on a branch needs the expensive emulator pass. This
# also keeps rapid checkpoint pushes from running multiple SDE instances in
# parallel on shared Actions capacity.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        # linux/amd64 exercises the amd64 field assembly in the
        # vendored internals; macos-latest is arm64 and exercises the
        # arm64 + generic paths. The dedicated Intel SDE job below executes
        # the AVX-512 IFMA and native SHA kernels on every change.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      - run: go test -run TestDifferential -count=5 ./ed25519
  purego:
    # Prove the no-assembly fallbacks compile and pass everywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - run: go test -tags purego ./...
      - run: GOARCH=amd64 GOAMD64=v1 go build ./...

  oasis-compare:
    # Independent predicate oracle only. Keep curve25519-voi outside the
    # library's main module graph and opt into its pinned modfile explicitly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - run: go test -modfile=go.oasis.mod -tags oasis_compare ./ed25519

  sde-ifma:
    # Functional coverage only: SDE timings are not performance evidence.
    # Intel SDE 10.8 is downloaded from Intel's official mirror and checked
    # against the SHA-256 published on the official download page:
    # https://www.intel.com/content/www/us/en/download/684897/intel-software-development-emulator.html
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SDE_ARCHIVE: sde-external-10.8.0-2026-03-15-lin.tar.xz
      SDE_SHA256: 50b320cd226acef7a491f5b321fc1be3c3c7984f9e27a456e64894b5b0979dd3
      SDE_URL: https://downloadmirror.intel.com/915934/sde-external-10.8.0-2026-03-15-lin.tar.xz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.4"
      - name: Download pinned Intel SDE
        run: |
          curl --fail --location --retry 3 "$SDE_URL" --output "/tmp/$SDE_ARCHIVE"
          echo "$SDE_SHA256  /tmp/$SDE_ARCHIVE" | sha256sum --check --strict
          tar --extract --xz --file "/tmp/$SDE_ARCHIVE" --directory /tmp
          echo "SDE64=/tmp/${SDE_ARCHIVE%.tar.xz}/sde64" >> "$GITHUB_ENV"
      - name: Permit SDE instrumentation on Ubuntu
        run: sudo sysctl --write kernel.yama.ptrace_scope=0
      - name: Compile focused native test binaries
        run: |
          go test -c -tags sde_gate -o /tmp/r51x5.test ./internal/r51x5
          go test -c -tags sde_gate -o /tmp/sha512mb.test ./sha512mb
          go test -c -tags sde_gate -o /tmp/ed25519.test ./ed25519
      - name: Require and test r51x5 IFMA kernels under SDE
        run: |
          bash ./scripts/run-sde-test.sh /tmp/r51x5.test -test.v -test.count=1 -test.timeout=20m \
            -test.run '^(TestSDEIFMARequired|TestExperimentalIFMAMultiplyX8X4|TestExperimentalIFMAPointOperations|TestIFMADecodeHardwareEveryMaskMatchesReference|TestIFMADecode2HardwareMatchesReference|TestIFMADecodeComposableHardwareEveryMaskX8|TestIFMADecodeComposablePrepareDifferentialX8|TestExperimentalIFMAComposableHardware|TestExperimentalIFMAFixedDSMHardware|TestExperimentalIFMABatchEncodeX4MatchesModelAndAllocatesZero|TestIFMASquareRawExperimentX8.*|TestIFMAPointDoubleRawSquareStage2X8.*|TestIFMAProjectiveNielsPreSignedMicroAoSStoreTransposeX8|TestIFMAProjectiveNielsPreSignedMicroAoSTransposePrepareX8)$'
      - name: Require and test native SHA-512 kernels under SDE
        run: |
          bash ./scripts/run-sde-test.sh /tmp/sha512mb.test -test.v -test.count=1 -test.timeout=20m \
            -test.run '^(TestSDENativeSHARequired|TestNativeX4Differential|TestNativeX8Differential|TestExperimentalSum512Batch3Differential)$'
      - name: Test forced public r51 verification under SDE
        run: |
          bash ./scripts/run-sde-test.sh /tmp/ed25519.test -test.v -test.count=1 -test.timeout=20m \
            -test.run '^TestSDEForcedR51PublicPath$'
          bash ./scripts/run-sde-test.sh /tmp/ed25519.test -test.v -test.count=1 -test.timeout=20m \
            -test.run '^(TestR51BackendDispatchDifferential|TestR51BackendInternalFaultFallsBackToGeneric|TestR51IFMABatchQPipelineDifferential|TestR51IFMABatchQPipelineEveryLaneAndTailMapping|TestRawBackendPathsApplyTheProfilePrePass|TestRawBatchPathRejectsOnlyThePrePassFailures|TestR51WarmGroupSurvivesMalformedSignatureAtEveryLane)$'

      # Everything above runs the x4 paths only. The x8/ZMM groups, the
      # decoded-A cache tier, warm x4 pairing and the raw-square schedule are
      # gated on an AuthenticAMD vendor string and a family check, and SDE
      # emulates Intel parts, so those policies all report false above. Without
      # this second pass the library's headline path has no automated coverage
      # anywhere and a regression in it merges green.
      #
      # narya_test_amd_policy widens the family gate for correctness coverage
      # only. It is a build tag precisely so no ordinary build can contain it,
      # and these runs are not performance evidence: SDE is an emulator, and the
      # policies being overridden were chosen by measurement on real AMD parts.
      - name: Compile AMD-policy test binaries
        run: |
          go test -c -tags 'sde_gate narya_test_amd_policy' -o /tmp/cpufeat.wide.test ./internal/cpufeat
          go test -c -tags 'sde_gate narya_test_amd_policy' -o /tmp/r51x5.wide.test ./internal/r51x5
          go test -c -tags 'sde_gate narya_test_amd_policy' -o /tmp/ed25519.wide.test ./ed25519
      - name: Require the override to actually reach the gated paths
        run: |
          bash ./scripts/run-sde-test.sh /tmp/cpufeat.wide.test -test.v -test.count=1 -test.timeout=5m \
            -test.run '^TestAMDPolicyOverrideReachesTheGatedPaths$'
      - name: Test x8, decoded-A and warm pairing under SDE
        run: |
          bash ./scripts/run-sde-test.sh /tmp/r51x5.wide.test -test.v -test.count=1 -test.timeout=20m \
            -test.run '^(TestSDEIFMARequired|TestExperimentalIFMAMultiplyX8X4|TestExperimentalIFMAPointOperations|TestIFMADecodeComposableHardwareEveryMaskX8|TestIFMADecodeComposablePrepareDifferentialX8|TestExperimentalIFMAFixedDSMHardware|TestIFMASquareRawExperimentX8.*|TestIFMAPointDoubleRawSquareStage2X8.*|TestIFMAProjectiveNielsPreSignedMicroAoSStoreTransposeX8|TestIFMAProjectiveNielsPreSignedMicroAoSTransposePrepareX8)$'
          bash ./scripts/run-sde-test.sh /tmp/ed25519.wide.test -test.v -test.count=1 -test.timeout=20m \
            -test.run '^(TestSDEForcedR51PublicPath|TestR51BackendDispatchDifferential|TestR51IFMABatchQPipelineDifferential|TestR51IFMABatchQPipelineEveryLaneAndTailMapping|TestR51WarmGroupSurvivesMalformedSignatureAtEveryLane|TestRawBatchPathRejectsOnlyThePrePassFailures)$'
